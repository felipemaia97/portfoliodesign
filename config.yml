# ============================================================
# Configuração do painel. Troque SEU-USUARIO e SEU-REPOSITORIO.
# base_url: endereço do Worker de login (ver passo 3 das instruções).
# ============================================================
backend:
  name: github
  repo: SEU-USUARIO/SEU-REPOSITORIO
  branch: main
  base_url: https://SEU-WORKER.workers.dev

media_folder: fotos
public_folder: /fotos

collections:
  - name: site
    label: Site
    files:
      - name: conteudo
        label: Conteúdo do site
        file: content.json
        fields:
          - { label: Nome, name: nome, widget: string }
          - { label: Banner da página inicial (foto recortada), name: banner, widget: image, required: false }
          - { label: WhatsApp (DDI + DDD + número, só dígitos), name: whatsapp, widget: string }
          - { label: Mensagem pré-preenchida no WhatsApp, name: whatsappMsg, widget: text }
          - label: Sobre mim
            name: sobre
            widget: object
            fields:
              - { label: Foto, name: foto, widget: image, required: false }
              - label: Parágrafos
                name: texto
                widget: list
                field: { label: Parágrafo, name: paragrafo, widget: text }
              - label: Habilidades
                name: habilidades
                widget: list
                fields:
                  - { label: Ferramenta, name: nome, widget: string }
                  - { label: Nível (%), name: nivel, widget: number, value_type: int, min: 0, max: 100 }
          - label: Trabalhos (pastas)
            name: categorias
            widget: list
            fields:
              - { label: Nome da categoria, name: nome, widget: string }
              - { label: Descrição, name: descricao, widget: text }
              - label: Projetos
                name: projetos
                widget: list
                fields:
                  - { label: Título, name: titulo, widget: string }
                  - { label: Tags (ex.: Logo · Manual), name: tags, widget: string }
                  - { label: Link do projeto no Behance, name: link, widget: string }
                  - { label: Capa (imagem do preview), name: capa, widget: image, required: false }
          - label: Contatos
            name: contatos
            widget: object
            fields:
              - { label: Instagram (link), name: instagram, widget: string }
              - { label: TikTok (link), name: tiktok, widget: string }
              - { label: Pinterest (link), name: pinterest, widget: string }
              - { label: Behance (link), name: behance, widget: string }
              - { label: E-mail, name: email, widget: string }
